name: CloudERP CI/CD Pipeline

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Service (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service:
          - name: frontend
            context: .
            dockerfile: Dockerfile.frontend
          - name: gateway
            context: ./gateway_service
            dockerfile: ./gateway_service/dockerfile
          - name: auth
            context: ./ERP_System
            dockerfile: ./ERP_System/dockerfile
          - name: account
            context: ./account-main
            dockerfile: ./account-main/dockerfile
          - name: inventory
            context: ./inventory
            dockerfile: ./inventory/dockerfile
          - name: workflow
            context: ./workflow-service
            dockerfile: ./workflow-service/Dockerfile
          - name: communication
            context: ./communication-service
            dockerfile: ./communication-service/Dockerfile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            mohit950/clouderp:${{ matrix.service.name }}-latest
            mohit950/clouderp:${{ matrix.service.name }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  deploy-production:
    name: Deploy to Production Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "=========================================================="
            echo " Starting Automated CloudERP Production Deployment"
            echo " Commit SHA: ${{ github.sha }}"
            echo "=========================================================="

            DEPLOY_DIR="/opt/cloudERP"

            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "ERROR: Deployment directory $DEPLOY_DIR does not exist on server!"
              echo "Please follow README.md first-time setup instructions to clone repository."
              exit 1
            fi

            cd "$DEPLOY_DIR"

            # Sync repository definitions (docker-compose, scripts, nginx configs)
            if [ -d .git ]; then
              echo "Fetching latest deployment configuration from GitHub..."
              git fetch origin main
              git reset --hard origin/main
            fi

            chmod +x *.sh

            # Trigger deployment pulling prebuilt Docker Hub images
            echo "Executing deploy.sh with commit tag: ${{ github.sha }}..."
            ./deploy.sh "${{ github.sha }}"

            echo "=========================================================="
            echo " Deployment Finished Successfully!"
            echo "=========================================================="
