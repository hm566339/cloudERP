# Map for WebSocket upgrade headers
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3001;
    listen [::]:3001;
    server_name localhost www.mark2.in mark2.in _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # --------------------------------------------------------------------------
    # 1. API Reverse Proxy to Spring Cloud Gateway
    # --------------------------------------------------------------------------
    # Browser: https://www.mark2.in/api/... -> Gateway: http://gateway-service:8080/api/...
    location /api/ {
        proxy_pass http://gateway-service:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
    }

    # --------------------------------------------------------------------------
    # 1a. CloudERP Internal Chat WebSocket (/ws-chat) -> communication-service:8084
    # --------------------------------------------------------------------------
    location ^~ /ws-chat {
        proxy_pass http://communication-service:8084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 90s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 2. Static Assets Caching (/erp/assets/)
    # --------------------------------------------------------------------------
    location ^~ /erp/assets/ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # --------------------------------------------------------------------------
    # 3. Clean Redirect: /erp -> /erp/
    # --------------------------------------------------------------------------
    location = /erp {
        return 301 /erp/;
    }

    # --------------------------------------------------------------------------
    # 4. CloudERP Frontend & SPA Fallback for /erp/
    # --------------------------------------------------------------------------
    location /erp/ {
        try_files $uri $uri/ /erp/index.html;
    }

    # --------------------------------------------------------------------------
    # 5. Direct Fallback & Healthcheck
    # --------------------------------------------------------------------------
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    location / {
        try_files $uri $uri/ /erp/index.html;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
