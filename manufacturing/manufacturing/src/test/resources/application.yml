spring:
  config:
    import:
      - optional:classpath:application-sso-auth.yml
  datasource:
    url: jdbc:h2:mem:manufacturing;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

manufacturing:
  outbox:
    scheduler:
      enabled: false
