
inventory:
  seed:
    master-data: true
spring:
  application:
    name: ${SPRING_APPLICATION_NAME:inventory-service}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:classpath:application-sso-auth.yml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:mohit}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: HikariCP
  

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.erp.inventory: DEBUG

  sql:
    init:
      mode: always

    show-sql: true

    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8082}

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html
    enabled: true

frontend:
  url: ${FRONTEND_URL:${PUBLIC_BASE_URL:https://www.mark2.in}/erp/inventory}

sso:
  frontend: ${SSO_FRONTEND:${FRONTEND_URL:${PUBLIC_BASE_URL:https://www.mark2.in}/erp/inventory}}
  backend: ${SSO_BACKEND:http://auth-service:8090}
  cookie: ${COOKIE_PATH:/}

  base-url: ${BASE_URL:${PUBLIC_BASE_URL:https://www.mark2.in}/api/inventory}
  login-url: ${SSO_LOGIN_URL:${PUBLIC_BASE_URL:https://www.mark2.in}/erp/login}

  client-id: ${SSO_CLIENT_ID:}
  client-secret: ${SSO_CLIENT_SECRET:}

  transport: ${SSO_TRANSPORT:cookie}
  callback-path: ${SSO_CALLBACK_PATH:/auth/callback}

  cookie-name: ${SSO_COOKIE_NAME:ACCESS_TOKEN}
  cookie-path: ${SSO_COOKIE_PATH:/}
  cookie-secure: ${SSO_COOKIE_SECURE:false}
  cookie-http-only: ${SSO_COOKIE_HTTP_ONLY:true}
  cookie-same-site: ${SSO_COOKIE_SAME_SITE:Lax}

  module-name: ${SSO_MODULE_NAME:INVENTORY}

core:
  service:
    url: ${CORE_SERVICE_URL:http://account-service:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyWithAtLeast32CharactersForHmacSha256}

workflow:
  service:
    url: ${WORKFLOW_SERVICE_URL:http://workflow-service:8083}
  callback:
    secret: ${WORKFLOW_CALLBACK_SECRET:erp-workflow-internal-callback-secret}


