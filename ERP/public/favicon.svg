<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#071D4A"/>
      <stop offset="48%" stop-color="#0866D8"/>
      <stop offset="100%" stop-color="#16D7F0"/>
    </linearGradient>
    <linearGradient id="darkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102B62"/>
      <stop offset="100%" stop-color="#06152F"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/>
    </filter>
  </defs>

  <!-- MARK2 emblem -->
  <g filter="url(#soft)">
    <!-- left M wing -->
    <path d="M245 300 L455 465 L365 555 L245 462 Z" fill="url(#darkBlue)"/>
    <path d="M245 300 L365 392 L365 555 L245 640 Z" fill="url(#blue)"/>

    <!-- central ribbon -->
    <path d="M365 392 L455 465 L690 250
             Q735 210 800 205 L800 300
             Q750 310 710 350 L500 555
             Q470 585 440 560 L365 500 Z" fill="url(#blue)"/>

    <!-- right 2 -->
    <path d="M800 300
             Q850 250 915 275
             Q965 295 965 350
             Q965 405 915 435
             L760 525 L965 525 L965 620 L675 620
             Q645 620 645 590
             Q645 565 675 545 L875 425
             Q900 410 900 380
             Q900 355 870 350
             L800 350 Z" fill="url(#blue)"/>

    <!-- lower left M foot -->
    <path d="M365 500 L455 570 L455 660 L365 600 Z" fill="url(#darkBlue)"/>

    <!-- digital pixels -->
    <rect x="810" y="165" width="30" height="30" rx="5" fill="#075ED1"/>
    <rect x="850" y="125" width="22" height="22" rx="4" fill="#0A83E8"/>
    <rect x="890" y="95" width="42" height="42" rx="7" fill="#12CDEB"/>
    <rect x="855" y="175" width="18" height="18" rx="4" fill="#14BDEB"/>
    <rect x="900" y="155" width="24" height="24" rx="4" fill="#0876DF"/>
  </g>

  <!-- MARK2 wordmark -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" letter-spacing="2">
    <text x="110" y="820" font-size="150" fill="#07152F">MARK</text>
    <text x="885" y="820" font-size="150" fill="url(#blue)">2</text>
  </g>

  <!-- A accent -->
  <path d="M355 780 L388 718 L421 780 Z" fill="#12CBEA"/>

  <!-- tagline -->
  <text x="600" y="875" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="32"
        letter-spacing="13" fill="#18253A">
    IDEAS  |  TECHNOLOGY  |  IMPACT
  </text>

  <!-- divider -->
  <line x1="300" y1="935" x2="900" y2="935" stroke="#9AA6B8" stroke-width="2"/>
  <line x1="540" y1="935" x2="660" y2="935" stroke="#0ABFEA" stroke-width="6"/>

  <!-- motto -->
  <text x="600" y="995" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="27"
        letter-spacing="8" fill="#596578">
    BUILT FOR A SMARTER INDIA
  </text>
</svg>