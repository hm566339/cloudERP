<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#18181b" />
  <meta name="description" content="Mark2 ERP Platform — Manage Sales, Inventory, Procurement, and Accounting in one unified enterprise SaaS platform." />
  <title>Mark2 ERP — Manage Sales, Inventory, Purchase & Accounting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <!-- FOUC prevention: apply dark class before first paint -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('theme_mode');
        // Legacy fallback for old boolean key
        if (!mode) {
          var legacy = localStorage.getItem('theme_dark');
          if (legacy === 'true') mode = 'dark';
          else if (legacy === 'false') mode = 'light';
          else mode = 'system';
        }
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    })();
  </script>
  <style>
    html.dark, html.dark body {
      background-color: #0F1117 !important;
      color: #E6E8EE;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
