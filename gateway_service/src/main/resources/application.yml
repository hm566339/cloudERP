spring:
  config:
    import: optional:file:.env[.properties]
  cloud:
    gateway:

server:
  max-http-request-header-size: 32KB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

logging:
  level:
    com.erp.gateway_service: DEBUG
    org.springframework.cloud.gateway: INFO

auth:
  server:
    base-uri: ${AUTH_SERVER_BASE_URI:http://localhost:8090}

  service:
    base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8090}