spring:
  application:
    name: communication-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/communication_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:mohit}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: CommunicationHikariCP

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:${RABBITMQ_HOST:localhost}}
    port: ${SPRING_RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
    username: ${SPRING_RABBITMQ_USERNAME:${RABBITMQ_DEFAULT_USER:mark2}}
    password: ${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_DEFAULT_PASS:mark2secret}}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.erp.communication: DEBUG
    org.springframework.security: WARN
    org.springframework.mail: INFO

app:
  jwt:
    secret: ${JWT_SECRET:default-must-be-overridden-in-production}
  service-auth:
    internal-token: ${COMM_SERVICE_TOKEN:mark2-internal-comm-secret-token}
    header-name: ${COMM_SERVICE_TOKEN_HEADER:X-Service-Token}
  smtp:
    host: ${COMM_SMTP_HOST:smtp.gmail.com}
    port: ${COMM_SMTP_PORT:587}
    username: ${COMM_SMTP_USERNAME:}
    password: ${COMM_SMTP_PASSWORD:}
    auth: ${COMM_SMTP_AUTH:true}
    starttls-enable: ${COMM_SMTP_STARTTLS_ENABLE:true}
    starttls-required: ${COMM_SMTP_STARTTLS_REQUIRED:true}
    from-address: ${COMM_EMAIL_FROM_ADDRESS:noreply@mark2.in}
    from-name: ${COMM_EMAIL_FROM_NAME:Mark2 ERP}
    reply-to: ${COMM_EMAIL_REPLY_TO:}
    connection-timeout-ms: ${COMM_SMTP_CONNECTION_TIMEOUT_MS:10000}
    timeout-ms: ${COMM_SMTP_TIMEOUT_MS:10000}
    write-timeout-ms: ${COMM_SMTP_WRITE_TIMEOUT_MS:10000}
  outbox:
    enabled: ${OUTBOX_WORKER_ENABLED:true}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:10000}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    max-retries: ${OUTBOX_MAX_RETRIES:3}
  rabbitmq:
    exchange: ${RABBITMQ_NOTIFICATION_EXCHANGE:erp.notification.exchange}
    dlx-exchange: ${RABBITMQ_NOTIFICATION_DLX:erp.notification.dlx}
    email-queue: ${RABBITMQ_EMAIL_QUEUE:erp.notification.email.queue}
    email-routing-key: ${RABBITMQ_EMAIL_ROUTING_KEY:notification.email}
    email-dlq: ${RABBITMQ_EMAIL_DLQ:erp.notification.email.dlq}
    email-dlq-routing-key: ${RABBITMQ_EMAIL_DLQ_ROUTING_KEY:notification.email.dlq}
    whatsapp-queue: ${RABBITMQ_WHATSAPP_QUEUE:erp.notification.whatsapp.queue}
    whatsapp-routing-key: ${RABBITMQ_WHATSAPP_ROUTING_KEY:notification.whatsapp}
    whatsapp-dlq: ${RABBITMQ_WHATSAPP_DLQ:erp.notification.whatsapp.dlq}
    whatsapp-dlq-routing-key: ${RABBITMQ_WHATSAPP_DLQ_ROUTING_KEY:notification.whatsapp.dlq}
    concurrency: ${RABBITMQ_CONCURRENCY:2}
    max-concurrency: ${RABBITMQ_MAX_CONCURRENCY:5}
    prefetch: ${RABBITMQ_PREFETCH:10}
    max-attempts: ${RABBITMQ_MAX_ATTEMPTS:3}
    initial-interval-ms: ${RABBITMQ_INITIAL_INTERVAL_MS:1000}
    multiplier: ${RABBITMQ_MULTIPLIER:2.0}
    max-interval-ms: ${RABBITMQ_MAX_INTERVAL_MS:10000}
  whatsapp:
    provider: ${WHATSAPP_PROVIDER:mock}
    enabled: ${WHATSAPP_ENABLED:true}
    fail-if-unconfigured: ${WHATSAPP_FAIL_IF_UNCONFIGURED:true}
    api-url: ${WHATSAPP_API_URL:}
    api-token: ${WHATSAPP_API_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}

sso:
  backend: ${SSO_BACKEND:http://auth-service:8090}
  cookie-name: ${SSO_COOKIE_NAME:access_token}
  verification:
    enabled: ${SSO_VERIFICATION_ENABLED:true}
  authorization:
    modules:
      COMMUNICATION_CHAT:
        - "/api/communication/v1/chat"
        - "/api/communication/v1/chat/**"
        - "/api/communication/v1/notifications"
        - "/api/communication/v1/notifications/**"
      COMMUNICATION_NOTIFICATIONS:
        - "/api/communication/v1/notifications"
        - "/api/communication/v1/notifications/**"
      COMMUNICATION_MESSAGES:
        - "/api/communication/v1/messages"
        - "/api/communication/v1/messages/**"
    method-actions:
      GET:
        - "READ"
      POST:
        - "CREATE"
        - "WRITE"
      PUT:
        - "UPDATE"
        - "WRITE"
      PATCH:
        - "UPDATE"
        - "WRITE"
      DELETE:
        - "DELETE"

