# ==============================================================================
# Host Nginx Configuration Snippet for www.mark2.in
# ==============================================================================
# Add these location blocks INSIDE your existing Nginx HTTPS server block:
#   server {
#       listen 443 ssl http2;
#       server_name www.mark2.in mark2.in;
#       ...
#   }
#
# IMPORTANT:
# - Do NOT replace your existing "location /" or main website configuration!
# - Your main website at https://www.mark2.in/ continues to run completely untouched.
# - CloudERP runs as subpaths: /erp/ (frontend) and /api/ (backend gateway).
# ==============================================================================

# 1. Place this map block in the http context (/etc/nginx/nginx.conf) if not present:
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

# ------------------------------------------------------------------------------
# 2. Add these location blocks into your existing server { ... } block:
# ------------------------------------------------------------------------------

    # 1. Clean redirect for bare /erp to /erp/
    location = /erp {
        return 301 https://$host/erp/;
    }

    # 2. CloudERP Frontend (/erp/): SPA UI and /erp/assets/...
    location /erp/ {
        proxy_pass http://127.0.0.1:3001/erp/;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /erp;

        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # 3. CloudERP Backend API (/api/): proxied to CloudERP stack
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;

        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # (Your existing website "location /" or PHP/Node proxy remains untouched below)
