# ==============================================================================
# Host Nginx Configuration for www.mark2.in and mark2.in
# ==============================================================================
# Architecture:
# - Existing Marketing Website (Next.js on Vercel): Reverse proxied at /
# - CloudERP Frontend (Vite / React): Proxied at /erp/ to 127.0.0.1:3001
# - CloudERP Backend (Spring Cloud Gateway): Proxied at /api/ to 127.0.0.1:3001/api/
# ==============================================================================

# Map for WebSocket upgrade headers
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. HTTP Server (Port 80): ACME Challenge & HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name www.mark2.in mark2.in;

    # Let's Encrypt / Certbot ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server (Port 443): Full Path Router
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mark2.in mark2.in;

    # SSL Certificates (managed via Certbot or fallback)
    ssl_certificate /etc/ssl/certs/mark2.in.crt;
    ssl_certificate_key /etc/ssl/private/mark2.in.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # --------------------------------------------------------------------------
    # 1. Clean redirect for bare /erp to /erp/
    # --------------------------------------------------------------------------
    location = /erp {
        return 301 https://$host/erp/;
    }

    # --------------------------------------------------------------------------
    # 2. CloudERP Frontend (/erp/): SPA UI, deep routes, and static assets
    # --------------------------------------------------------------------------
    location /erp/ {
        proxy_pass http://127.0.0.1:3001/erp/;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /erp;

        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # --------------------------------------------------------------------------
    # 3. CloudERP Backend API Gateway (/api/): proxied to CloudERP stack
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;

        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # --------------------------------------------------------------------------
    # 3a. CloudERP Internal Chat WebSocket (/ws-chat): proxied to communication-service
    # --------------------------------------------------------------------------
    location ^~ /ws-chat {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 90s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 4. Existing Marketing Website: Reverse Proxy to Vercel Upstream
    # --------------------------------------------------------------------------
    location / {
        proxy_pass https://kes-denge.vercel.app;
        proxy_http_version 1.1;

        # SSL SNI configuration for Vercel
        proxy_ssl_server_name on;
        proxy_ssl_name kes-denge.vercel.app;

        # Host headers for Vercel upstream
        proxy_set_header Host kes-denge.vercel.app;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
