      ACCOUNT_CATEGORIES:
        - "/api/account/account-categories"
        - "/api/account/account-categories/**"
        - "/api/account/ledger/categories/**"
      GST_SLABS:
        - "/api/account/gst-slabs/**"
        - "/api/account/tax/gst-slabs/**"
      HSN_SAC:
        - "/api/account/hsn-sac/**"
        - "/api/account/tax/hsn-sac/**"
        - "/api/account/reports/export/hsn-sac"
        - "/api/account/reports/export/hsn-sac/**"
        - "/api/account/reports/export/hsnpage-export"
        - "/api/account/reports/export/hsnpage-export/**"
      SALES_TAXES:
        - "/api/account/sales-taxes/**"
        - "/api/account/tax/sales-taxes/**"
      BANK_RECONCILIATION:
        - "/api/account/bank-reconciliation/**"
        - "/api/account/banks/reconciliation/**"
      AUDIT_LOGS:
        - "/api/account/audit-logs"
        - "/api/account/audit-logs/**"
      ACCOUNTING_PERIODS:
        - "/api/account/accounting-periods"
        - "/api/account/accounting-periods/**"
      FISCAL_YEARS:
        - "/api/account/fiscal-years"
        - "/api/account/fiscal-years/**"
      GST_MASTER:
        - "/api/account/gst/master/**"
      SETTINGS:
        - "/api/account/v1/settings/**"
        - "/api/account/workflow/**"

    method-actions:
      GET:
        - "READ"
      POST:
        - "CREATE"
        - "WRITE"
      PUT:
        - "UPDATE"
        - "WRITE"
      PATCH:
        - "UPDATE"
        - "WRITE"
      DELETE:
        - "DELETE"

    custom-action-suffixes:
      "/approve": "APPROVE"
      "/award": "AWARD"
      "/reject": "REJECT"
      "/cancel": "CANCEL"
      "/send": "SEND"
      "/reverse": "REVERSE"
      "/close": "CLOSE"
      "/post": "POST"
      "/confirm": "CONFIRM"
      "/verify": "UPDATE"
      "/export": "EXPORT"
      "/summary": "READ"
      "/gstr1": "READ"
      "/gstr3b": "READ"
      "/hsn-summary": "READ"
      "/itc": "READ"
      "/reconcile": "READ"

    feature-groups:
      SALES_INVOICE:
        SALES_INVOICES:
          - READ
          - CREATE
          - UPDATE
          - DELETE
        CUSTOMERS:
          - READ
        HSN_SAC:
          - READ
        SALES_TAXES:
          - READ
        GST_SLABS:
          - READ
      GST_REPORTS:
        GST_REPORTS:
          - READ
          - EXPORT

    write-implies-create-update: false