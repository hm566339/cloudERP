spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:classpath:config/authorization.yml
  application:
    name: ${NAME:erp-auth-service}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erp_auth}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:test@example.com}
    password: ${MAIL_PASSWORD:secret}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: true

  jpa:
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8090}
  address: ${SERVER_ADDRESS:0.0.0.0}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: when_authorized

  health:
    diskspace:
      enabled: true
    db:
      enabled: true

info:
  app:
    name: ${NAME:erp-auth-service}
    description: ${DESCRIPTION:Cloud ERP Authentication and SSO Service}
    version: ${VERSION:1.0.0}
    developer: ${DEVELOPER:CloudERP Team}
    organization: ${ORGANIZATION:Mark2}

logging:
  level:
    root: INFO
    org.springframework: WARN
  #    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# jwt:
#   secret: ${JWT_SECRET}
#   expiration: ${JWT_EXPIRATION}

api:
  frontend: ${APP_FRONTEND_URL:http://localhost:5173}
  base: ${SSO_BASE_URL:http://localhost:8090}
  internal-base: ${SSO_INTERNAL_URL:http://auth-service:8090}
  createCompany: ${CREATE_ADMIN_COMPANY:true}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}

billing:
  webhook:
    secret: ${BILLING_WEBHOOK_SECRET:}

razorpay:
  enabled: ${RAZORPAY_ENABLED:true}
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com/v1/plans}
  reconciliation:
    enabled: ${RAZORPAY_RECONCILIATION_ENABLED:false}
    cron: ${RAZORPAY_RECONCILIATION_CRON:0 */15 * * * *}
    pending-threshold-minutes: ${RAZORPAY_RECONCILIATION_THRESHOLD_MINUTES:30}
    batch-size: ${RAZORPAY_RECONCILIATION_BATCH_SIZE:50}

system:
  admin:
    email: ${ADMIN_USERNAME:admin@example.com}
    password: ${ADMIN_PASSWORD:admin123}

strapi:
  server: ${STRAPI_SERVER:http://localhost:8090}
  token: ${STRAPI_TOKEN:}

sso:
  trial-days: ${SSO_TRIAL_DAYS:30}
  default-plan-code: ${SSO_DEFAULT_PLAN_CODE:30_DAY_FREE_TRIAL}
  trial-expiry-cron: ${SSO_TRIAL_EXPIRY_CRON:0 0 * * * *}
  cookies:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
    
cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME:demo}
  api_key: ${CLOUDINARY_API_KEY:123456789}
  api_secret: ${CLOUDINARY_API_SECRET:secret}

platform:
  admin:
    session-duration-minutes: ${PLATFORM_ADMIN_SESSION_DURATION:480}
    support:
      default-duration-minutes: ${PLATFORM_SUPPORT_DEFAULT_DURATION:30}
      max-duration-minutes: ${PLATFORM_SUPPORT_MAX_DURATION:60}
    login:
      max-failed-attempts: ${PLATFORM_LOGIN_MAX_FAILED_ATTEMPTS:5}
      lockout-minutes: ${PLATFORM_LOGIN_LOCKOUT_MINUTES:15}

