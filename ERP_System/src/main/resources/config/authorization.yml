sso:
  authorization:
    write-implies-create-update: false

    modules:
      AUTH:
        - "/api/sso/auth/**"
        - "/api/sso/me"

      USER:
        - "/api/sso/user/**"

      ROLE:
        - "/api/sso/role/**"

      PERMISSION:
        - "/api/sso/permissions/**"

      FEATURE:
        - "/api/sso/features/**"

      MODULE:
        - "/api/sso/module/**"

      MODULE_ROUTE:
        - "/api/sso/module-routes/**"

      COMPANY:
        - "/api/sso/company/**"
        - "/api/sso/company"
        - "/api/sso/companies/**"
        - "/api/sso/companies"
        - "/api/company/**"
        - "/api/company"
        - "/api/companies/**"
        - "/api/companies"
        - "/api/sso/company-modules/**"

      COMPANY_SUBSCRIPTION:
        - "/api/sso/company-subscriptions/**"

      SUBSCRIPTION:
        - "/api/sso/subscription/**"
        - "/api/sso/subscription"
        - "/api/sso/subscriptions/**"
        - "/api/sso/subscriptions"
        - "/api/subscription/**"
        - "/api/subscription"
        - "/api/subscriptions/**"
        - "/api/subscriptions"

      SUBSCRIPTION_PLAN:
        - "/api/sso/subscription-plans/**"

      SESSION:
        - "/api/sso/session/**"

      ORGANIZATION_ROLE_TEMPLATES:
        - "/api/sso/organization/role-templates/**"
        - "/api/organization/role-templates/**"

      ORGANIZATION_MEMBERS:
        - "/api/sso/organization/members/**"
        - "/api/organization/members/**"

      ORGANIZATION_PERMISSIONS:
        - "/api/sso/organization/permissions/**"
        - "/api/organization/permissions/**"

      ORGANIZATION_APPEARANCE:
        - "/api/sso/organization/appearance/**"
        - "/api/organization/appearance/**"

      ORGANIZATION:
        - "/api/sso/organization/**"
        - "/api/organization/**"
        - "/api/settings/**"
        - "/api/sso/settings/**"

      PORTAL_ACCESS:
        - "/api/sso/portal-access/**"

      DASHBOARD:
        - "/api/sso/dashboard/**"

      PLATFORM_ADMIN:
        - "/api/sso/platform/**"
        - "/api/sso/admin/**"
        - "/api/admin/**"

      BILLING:
        - "/api/billing/**"
        - "/api/sso/billing/**"

    method-actions:
      GET:
        - READ
      POST:
        - CREATE
        - WRITE
      PUT:
        - UPDATE
        - WRITE
      PATCH:
        - UPDATE
        - WRITE
      DELETE:
        - DELETE

    custom-action-suffixes:
      "/approve": APPROVE
      "/award": AWARD
      "/reject": REJECT
      "/cancel": CANCEL
      "/send": SEND
      "/reverse": REVERSE
      "/close": CLOSE
      "/post": POST
      "/confirm": CONFIRM
      "/verify": UPDATE
      "/export": EXPORT
      "/reset": WRITE

    feature-groups: {}
